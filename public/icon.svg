<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle geometric grid for factoring/geometry theme -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="168" x2="432" y2="168" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="344" x2="432" y2="344" />
    <line x1="80" y1="432" x2="432" y2="432" />
    <line x1="80" y1="80" x2="80" y2="432" />
    <line x1="168" y1="80" x2="168" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="344" y1="80" x2="344" y2="432" />
    <line x1="432" y1="80" x2="432" y2="432" />
  </g>

  <!-- Visual factoring squares (a^2 + ab + ab + b^2 representation) -->
  <g transform="translate(100, 110)">
    <!-- Big square: a^2 -->
    <rect x="0" y="0" width="180" height="180" rx="16" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="4" />
    <text x="90" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">x²</text>
    
    <!-- Top-right rectangle: ab -->
    <rect x="195" y="0" width="115" height="180" rx="16" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="4" />
    <text x="252" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">ax</text>

    <!-- Bottom-left rectangle: ab -->
    <rect x="0" y="195" width="180" height="115" rx="16" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="4" />
    <text x="90" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">ax</text>

    <!-- Bottom-right square: b^2 -->
    <rect x="195" y="195" width="115" height="115" rx="16" fill="#fbbf24" fill-opacity="0.5" stroke="#fbbf24" stroke-width="4" />
    <text x="252" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">a²</text>
  </g>

  <!-- Sparkle badge on top right -->
  <circle cx="410" cy="100" r="32" fill="#fbbf24" filter="drop-shadow(0 4px 12px rgba(251,191,36,0.5))" />
  <path d="M410 82 L414 96 L428 100 L414 104 L410 118 L406 104 L392 100 L406 96 Z" fill="#ffffff" />
</svg>
